[advisories]
yanked = "deny"
version = 2
unsound = "all"
ignore = [
  # Unmaintained transitive GTK proc-macro; no upstream fix.
  { id = "RUSTSEC-2024-0370", reason = "transitive GTK proc-macro dependency; no upstream fix" },
  # glib 0.18 is Tauri 2's newest compatible line; the unsound iterator is never
  # constructed. Drop this entry once Tauri ships GTK 0.20+.
  { id = "RUSTSEC-2024-0429", reason = "GTK 0.18 line has no fixed release; codepath unused" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
