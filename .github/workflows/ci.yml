name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org
  RUST_BACKTRACE: 1

  # Shared by every Linux job; keeps the GTK/WebKit toolchain in one place.
  LINUX_DEPS: >-
    sudo apt-get update &&
    sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev
    librsvg2-dev patchelf

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: ${{ env.LINUX_DEPS }} libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Audit npm dependencies
        run: bun audit --audit-level=high

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

  build:
    name: Build bundle (${{ matrix.os }})
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: ${{ env.LINUX_DEPS }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 7
