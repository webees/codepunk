name: Pi update

# Refreshes the pinned Pi release from its official SHA256SUMS and opens a pull
# request. Builds always use the reviewed pin; nothing floats at build time.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Pi version to pin (blank pins the latest release)
        default: latest

concurrency:
  group: pi-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bun scripts/update-pi.ts "$VERSION"
      - id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: scripts/pi.pin.json
          branch: pi/update
          delete-branch: true
          title: "chore(agent): 更新内置 Pi 到 ${{ steps.pin.outputs.version }}"
          commit-message: "chore(agent): 更新内置 Pi 到 ${{ steps.pin.outputs.version }}"
          body: |
            由 `bun scripts/update-pi.ts` 自动生成，校验和取自 Pi 官方 release 的 `SHA256SUMS`。

            合并前请审查 `scripts/pi.pin.json` 的版本与各平台哈希。
      # GITHUB_TOKEN 创建的 PR 不会触发 pull_request 工作流，这里显式调度 CI。
      - if: contains(fromJSON('["created","updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref pi/update
