name: Cleanup

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report without deleting
        type: boolean
        default: true

# Release runs are retained for audit; artifacts and caches expire automatically.
concurrency:
  group: cleanup
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          delete_workflow_pattern: "ci.yml|cleanup.yml|dependabot-automerge.yml"
          retain_days: 7
          keep_minimum_runs: 5
          dry_run: ${{ inputs.dry_run || 'false' }}
